name: demo

# End-to-end demo: perfscale + custom WASM reporter (this repo) + Allure2,
# published to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  demo:
    name: perfscale + wasm reporter + allure2
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # @perfscale/library-sdk is not published to npm yet — pack it from the
      # source repo.
      # TODO: once @perfscale/library-sdk is on npm, drop this checkout and
      # install it as a normal devDependency.
      - name: checkout sdk-libraries (for @perfscale/library-sdk tarball)
        uses: actions/checkout@v4
        with:
          repository: Perfscale/sdk-libraries
          path: sdk-libraries

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build wasm reporter from source
        run: SDK_DIR=sdk-libraries/ts ./scripts/build-wasm.sh

      - name: rebuilt wasm matches the committed contract
        run: |
          ls -l dist/allure2-reporter.wasm
          # sanity: the component embeds the reporter world name
          strings dist/allure2-reporter.wasm | grep -m1 perfscale:reporter

      - name: wasm reporter unit tests
        run: npm --prefix wasm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # No perfscale release ships wasm reporters yet — install from main.
      # TODO: after perfscale v0.27.0, download the release binary instead.
      - name: install perfscale (from main)
        run: cargo install --locked --git https://github.com/Perfscale/perfscale perfscale-cli

      - name: run the demo load test with the wasm reporter
        run: |
          node scripts/echo-server.mjs &
          echo $! > echo.pid
          trap 'kill $(cat echo.pid) 2>/dev/null || true' EXIT
          sleep 1
          perfscale run -f scripts/demo.test.yaml -c scripts/demo.config.yaml -q

      - name: verify the reporter output
        run: |
          count=$(find allure-results -name '*-result.json' | wc -l)
          test "$count" -ge 4
          test -f allure-results/environment.properties
          grep -q '^engine=native' allure-results/environment.properties
          find allure-results -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install allure CLI
        run: |
          ALLURE_VERSION=2.35.1
          curl -fsSL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" | tar xz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: generate allure report
        run: allure generate allure-results -o allure-report --clean

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

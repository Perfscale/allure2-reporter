# Demo: perfscale + WASM allure2 reporter.
# Needs the echo server: node scripts/echo-server.mjs
steps:
  - name: homepage
    use: std/http@v1
    with:
      method: GET
      url: http://127.0.0.1:18080/get
    check:
      status: 200
    outputs: resp

  - name: log status
    use: std/log@v1
    with:
      message: "got status ${{ resp.status }}"

  - use: std/sleep@v1
    with:
      ms: 200

# Used to regenerate fixtures/sample-report.json — see scripts/generate-fixture.sh
steps:
  - name: homepage
    use: std/http@v1
    with:
      method: GET
      url: https://httpbin.org/get
    check:
      status: 200
    outputs: resp

  - name: log status
    use: std/log@v1
    with:
      message: "got status ${{ resp.status }}"

  - use: std/sleep@v1
    with:
      ms: 200
